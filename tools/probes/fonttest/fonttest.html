<!doctype html>
<meta charset="utf-8">
<title>fonttest · Ruffle 中文字形能否落墨</title>
<body style="background:#111;color:#8fa;font:13px ui-monospace,monospace">
<pre id="r">running…</pre>
<script src="/ruffle/ruffle.js"></script>
<script>
window.fontTestReady = () => {
  const el = document.querySelector('ruffle-player')
  el.ruffle().ready.then(() => {
    document.getElementById('r').textContent = JSON.stringify(el.object.run(), null, 1)
  })
}
window.onload = async () => {
  const p = window.RufflePlayer.newest().createPlayer()
  p.style.width = '400px'; p.style.height = '200px'
  document.body.appendChild(p)
  await p.ruffle().load({
    url: '/tools/probes/fonttest/fonttest.swf',
    renderer: 'canvas', allowScriptAccess: true, autoplay: 'on',
    scale: 'noScale', warnOnUnsupportedContent: false,
  }).catch(e => { document.getElementById('r').textContent = 'load failed ' + e })
}
</script>
